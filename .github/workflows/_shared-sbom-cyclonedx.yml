name: "Kura SBOM scan via cyclonedx (shared)"

on:
  workflow_call:

env:
  JAVA_VERSION: '21' # java version used by the product
  JAVA_DISTRO: 'temurin' # java distro used by the product
  PLUGIN_VERSION: '2.9.1' # cyclonedx-maven-plugin version to use
  SBOM_TYPE: 'makeAggregateBom' # cyclonedx plugin goal
  WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
  INPUT_TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
  EVENT_NAME: ${{ github.event_name }}
  GITHUB_REF_NAME: ${{ github.ref_name }}

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set checkout ref
        id: set-checkout-ref
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "CHECKOUT_REF=$WORKFLOW_HEAD_BRANCH" >> $GITHUB_ENV
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "CHECKOUT_REF=$INPUT_TARGET_BRANCH" >> $GITHUB_ENV
          else
            echo "CHECKOUT_REF=$GITHUB_REF_NAME" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Debug branch information
        run: |
          echo "=== Debug Branch Information ==="
          echo "Event name: $EVENT_NAME"
          echo "Current branch (git): $(git branch --show-current)"
          echo "==============================="

      - name: Setup Java SDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Extract project info
        id: info
        shell: bash
        run: |
          project_name=$(\
            mvn --file ./pom.xml \
              -Dexec.executable=echo \
              -Dexec.args='${project.artifactId}' \
              --quiet exec:exec \
              --non-recursive \
          )

          resolved_version=$(\
            mvn --file ./pom.xml \
              -Dexec.executable=echo \
              -Dexec.args='${project.version}' \
              --quiet exec:exec \
              --non-recursive \
          )

          # Substitute "-SNAPSHOT" suffix with "@dev" if present
          version="${resolved_version/-SNAPSHOT/@dev}"

          # Set the output values
          echo "project_name=$project_name" >> $GITHUB_OUTPUT
          echo "resolved_version=$resolved_version" >> $GITHUB_OUTPUT
          echo "project_version=$version" >> $GITHUB_OUTPUT

          echo "=== Debug Project Information ==="
          echo "Project name: $project_name"
          echo "Resolved version: $resolved_version"
          echo "Project version: $version"
          echo "==============================="

      - name: Generate sbom
        run: |
          mvn org.cyclonedx:cyclonedx-maven-plugin:$PLUGIN_VERSION:$SBOM_TYPE \
            -DexcludeTypes=eclipse-target-definition \
            -DexcludeTestProject=true \
            -DprojectType=library \
            -Dcyclonedx.skipNotDeployed=false

      - name: Upload sbom
        uses: eclipse-csi/workflows/upload-sbom@d83da6f2897e985d9d2b9541174c7ee5ee6d88ad # main
        with:
          sbom-file: "./target/bom.json"
          product-name: ${{ steps.info.outputs.project_name }}
          product-version: ${{ steps.info.outputs.project_version }}
